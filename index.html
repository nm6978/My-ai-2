<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNR DRILL Ai - Professional Assistant</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --user-bubble: #2563eb;
            --ai-bubble: #1e293b;
            --thinking-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Layout */
        aside {
            width: 280px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .brand i {
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        .new-chat-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--accent-hover);
        }

        .sidebar-footer {
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            text-align: center;
        }

        /* Main Chat Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        /* Chat Messages Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.ai .avatar {
            background-color: var(--accent-color);
            color: white;
        }

        .message.user .avatar {
            background-color: #475569;
            color: white;
        }

        .content {
            background-color: var(--panel-color);
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            word-break: break-word;
        }

        .message.user .content {
            background-color: var(--user-bubble);
            border-color: transparent;
        }

        /* Thinking State Animation */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.9rem;
        }

        .dot-pulse {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .dot-pulse span {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Bar */
        .input-area {
            padding: 20px 24px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        textarea {
            width: 100%;
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 50px 14px 18px;
            border-radius: 10px;
            resize: none;
            height: 54px;
            max-height: 150px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .send-btn:hover {
            color: var(--accent-hover);
        }

        .send-btn:disabled {
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            aside { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div>
            <div class="brand">
                <i class="fa-solid fa-brain"></i>
                <span>SNR DRILL Ai</span>
            </div>
            <button class="new-chat-btn" onclick="resetChat()">
                <i class="fa-solid fa-plus"></i> New Session
            </button>
        </div>
        <div class="sidebar-footer">
            Powered by Mega Tech Infrastructure
        </div>
    </aside>

    <!-- Main Container -->
    <main>
        <header>
            <div class="header-title">SNR DRILL Intelligence Core</div>
            <div class="status-badge">
                <div class="status-dot"></div>
                System Active
            </div>
        </header>

        <!-- Message Box -->
        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="content">Greetings. I am SNR DRILL Ai, your professional engineering and intelligence system. How may I assist you with your operations today?</div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Type your message here..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "sk-live-nicsm1ajd2rmtvmhaeq";
        const API_URL = "https://smart-three-mu.vercel.app/api/chat";

        // Conversation history tracking array
        let messages = [
            { role: 'assistant', content: 'Greetings. I am SNR DRILL Ai, your professional engineering and intelligence system. How may I assist you with your operations today?' }
        ];

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function resetChat() {
            messages = [{ role: 'assistant', content: 'Session reset. How can I assist you?' }];
            chatContainer.innerHTML = `
                <div class="message ai">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="content">Session reset. How may I assist your engineering work today?</div>
                </div>
            `;
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input field
            userInput.value = '';
            
            // Append User Message to UI & History
            appendMessage(text, 'user');
            messages.push({ role: 'user', content: text });

            // Disable input elements during processing
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Render Thinking State
            const thinkingId = appendThinkingState();
            scrollToBottom();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: messages })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status code ${response.status}`);
                }

                const data = await response.json();
                
                // Remove thinking indicator
                removeElement(thinkingId);

                // Extract reply from typical response formats
                let aiResponseContent = "No response content received.";
                if (typeof data === 'string') {
                    aiResponseContent = data;
                } else if (data.content) {
                    aiResponseContent = data.content;
                } else if (data.message) {
                    aiResponseContent = typeof data.message === 'string' ? data.message : data.message.content;
                } else if (data.choices && data.choices[0]) {
                    aiResponseContent = data.choices[0].message.content;
                } else {
                    aiResponseContent = JSON.stringify(data);
                }

                // Append AI Response to UI & History
                appendMessage(aiResponseContent, 'ai');
                messages.push({ role: 'assistant', content: aiResponseContent });

            } catch (error) {
                removeElement(thinkingId);
                appendMessage(`[System Notice]: Error processing connection - ${error.message}`, 'ai');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                scrollToBottom();
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = sender === 'ai' ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = text;

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function appendThinkingState() {
            const id = 'thinking-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = id;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = '<i class="fa-solid fa-robot"></i>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.innerHTML = `
                <div class="thinking-indicator">
                    SNR DRILL Ai is analyzing parameters
                    <div class="dot-pulse">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
  </html>
