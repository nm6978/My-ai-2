<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNR DRILL AI</title>
    
    <!-- PWA / App Configuration -->
    <meta name="theme-color" content="#131314">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SNR DRILL AI">
    
    <!-- Dynamically Generated Web App Manifest -->
    <link id="manifest-placeholder" rel="manifest">

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #131314;
            --sidebar-bg: #1e1f20;
            --card-bg: #1e1f20;
            --hover-bg: #282a2c;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --accent-gradient: linear-gradient(135deg, #7cacf8 0%, #a8c7fa 50%, #d3e3fd 100%);
            --user-bubble: #282a2c;
            --border-subtle: #2e3135;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            border-right: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none; /* Hide sidebar on mobile phones for native app feel */
            }
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #1a1b1e;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 28px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--hover-bg);
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 0 12px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: var(--hover-bg);
        }

        /* Main Workspace */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100vh;
        }

        .top-bar {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 600;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .install-btn {
            display: none;
            background: var(--accent-gradient);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .chat-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-content {
            width: 100%;
            max-width: 768px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .greeting-text {
            font-size: 2.2rem;
            font-weight: 500;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .sub-greeting {
            font-size: 2.2rem;
            color: #444746;
            font-weight: 500;
        }

        .suggestion-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            background-color: var(--hover-bg);
        }

        /* Messages */
        .message-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar.ai-avatar {
            background: var(--accent-gradient);
            color: #000;
        }

        .bubble {
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .message-row.user .bubble {
            background-color: var(--user-bubble);
            padding: 12px 20px;
            border-radius: 20px;
        }

        .message-row.ai .bubble {
            padding-top: 4px;
        }

        /* Gemini Thinking Animation */
        .thinking-container {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .sparkle-icon {
            width: 20px;
            height: 20px;
            fill: #7cacf8;
            animation: pulse 1.5s infinite alternate;
        }

        .thinking-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-style: italic;
            background: linear-gradient(90deg, #7cacf8, #ffffff, #7cacf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Input Container */
        .input-wrapper {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            padding: 0 16px 16px 16px;
        }

        .input-box {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 6px 12px 6px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 8px 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn.recording {
            color: #f2b8b5;
            background-color: #601410;
            animation: pulse 1s infinite alternate;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" id="newChatBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            New chat
        </button>
        <div class="history-title">Recent</div>
        <div class="history-list">
            <div class="history-item">Executive Strategy</div>
            <div class="history-item">System Data Pipeline</div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-container">
        <div class="top-bar">
            <div class="brand-logo">SNR DRILL AI</div>
            <button class="install-btn" id="installBtn">📥 Install App</button>
        </div>

        <div class="chat-viewport" id="chatViewport">
            <div class="chat-content" id="chatContent">
                
                <div class="welcome-screen" id="welcomeScreen">
                    <div>
                        <div class="greeting-text">Hello, Operations</div>
                        <div class="sub-greeting">How can I assist you today?</div>
                    </div>
                    <div class="suggestion-cards">
                        <div class="card" onclick="autoPrompt('Who created you?')">
                            <span>Who created you?</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                        </div>
                        <div class="card" onclick="autoPrompt('Analyze technical metrics for optimization')">
                            <span>Analyze technical metrics</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Input Wrapper -->
        <div class="input-wrapper">
            <div class="thinking-container" id="thinkingIndicator">
                <svg class="sparkle-icon" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                <span class="thinking-text">SNR DRILL AI is thinking...</span>
            </div>

            <div class="input-box">
                <input type="text" id="userInput" placeholder="Ask SNR DRILL AI..." autocomplete="off">
                <button class="icon-btn" id="micBtn" title="Voice Input">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button class="icon-btn" id="sendBtn" title="Send">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

<script>
    /* --- PWA Manifest & Service Worker Registration --- */
    const manifestData = {
        "name": "SNR DRILL AI",
        "short_name": "SNR DRILL",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#131314",
        "theme_color": "#131314",
        "icons": [{
            "src": "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
            "sizes": "512x512",
            "type": "image/png"
        }]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    // Register empty ServiceWorker to fulfill PWA installation requirement
    if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', function(e) {});`;
        const swBlob = new Blob([swCode], {type: 'text/javascript'});
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL).catch(() => {});
    }

    // App Installation Handler
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    /* --- Core Chat Functionality --- */
    const API_KEY = "sk-live-nicsm1ajd2rmtvmhaeq";
    const API_URL = "https://smart-three-mu.vercel.app/api/chat";

    const chatViewport = document.getElementById('chatViewport');
    const chatContent = document.getElementById('chatContent');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const thinkingIndicator = document.getElementById('thinkingIndicator');
    const newChatBtn = document.getElementById('newChatBtn');

    const SYSTEM_INSTRUCTION = "You are SNR DRILL AI, an advanced enterprise AI assistant created by Nathaniel Mensah. Always state that Nathaniel Mensah is your creator whenever asked.";

    let conversationHistory = [{ role: "system", content: SYSTEM_INSTRUCTION }];

    function autoPrompt(text) {
        userInput.value = text;
        handleSend();
    }

    function appendUserMessage(text) {
        if (welcomeScreen) welcomeScreen.style.display = 'none';
        const row = document.createElement('div');
        row.className = 'message-row user';
        row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatContent.appendChild(row);
        chatViewport.scrollTop = chatViewport.scrollHeight;
    }

    function appendAIMessage(text) {
        const row = document.createElement('div');
        row.className = 'message-row ai';
        row.innerHTML = `<div class="avatar ai-avatar">S</div><div class="bubble">${escapeHtml(text)}</div>`;
        chatContent.appendChild(row);
        chatViewport.scrollTop = chatViewport.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendUserMessage(text);
        conversationHistory.push({ role: 'user', content: text });
        userInput.value = '';

        thinkingIndicator.style.display = 'flex';
        chatViewport.scrollTop = chatViewport.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ messages: conversationHistory })
            });

            const data = await response.json();
            thinkingIndicator.style.display = 'none';

            let aiMessage = "An error occurred while processing requests.";
            if (data?.choices?.[0]?.message?.content) {
                aiMessage = data.choices[0].message.content;
            } else if (data.reply) {
                aiMessage = data.reply;
            } else if (data.message) {
                aiMessage = typeof data.message === 'string' ? data.message : JSON.stringify(data.message);
            }

            appendAIMessage(aiMessage);
            conversationHistory.push({ role: 'assistant', content: aiMessage });
            speakText(aiMessage);

        } catch (error) {
            thinkingIndicator.style.display = 'none';
            appendAIMessage("Unable to contact SNR DRILL AI servers.");
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

    newChatBtn.addEventListener('click', () => {
        conversationHistory = [{ role: "system", content: SYSTEM_INSTRUCTION }];
        chatContent.innerHTML = '';
        chatContent.appendChild(welcomeScreen);
        welcomeScreen.style.display = 'flex';
    });

    /* --- Speech Recognition --- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        micBtn.addEventListener('click', () => {
            if (micBtn.classList.contains('recording')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });
        recognition.onstart = () => micBtn.classList.add('recording');
        recognition.onresult = (e) => {
            userInput.value = e.results[0][0].transcript;
            handleSend();
        };
        recognition.onerror = () => micBtn.classList.remove('recording');
        recognition.onend = () => micBtn.classList.remove('recording');
    } else {
        micBtn.style.display = 'none';
    }
</script>
</body>
  </html>
